<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vibe :3 - History</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
      gap: 24px;
    }
    h1 {
      font-size: 36px;
      font-weight: 700;
      background: linear-gradient(135deg, #e94560, #0f3460);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #search-bar {
      width: 100%;
      max-width: 700px;
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      background: #1a1a2e;
      color: white;
      font-size: 14px;
      outline: none;
    }
    #search-bar:focus { box-shadow: 0 0 0 2px #e94560; }
    #history-list {
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .history-item {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .history-item:hover { background: #16213e; }
    .history-favicon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
    }
    .history-info { flex: 1; overflow: hidden; }
    .history-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-url {
      font-size: 11px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-time { font-size: 11px; color: #555; white-space: nowrap; }
    .history-delete {
      background: none;
      border: none;
      color: #888;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
      border-radius: 6px;
    }
    .history-delete:hover { color: #e94560; background: #0f3460; }
    #clear-btn {
      padding: 10px 24px;
      border-radius: 10px;
      border: none;
      background: #e94560;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
    #clear-btn:hover { background: #c73652; }
    #empty { color: #555; font-size: 14px; }
  </style>
</head>
<body>
  <h1>History :3</h1>
  <input id="search-bar" type="text" placeholder="Search history... :3" />
  <div id="history-list"></div>
  <button id="clear-btn">Clear All History</button>

  <script>
    const { ipcRenderer } = require('electron')
    const fs = require('fs')
    const path = require('path')

    const historyPath = path.join(__dirname, 'history.json')
    const list = document.getElementById('history-list')
    const searchBar = document.getElementById('search-bar')

    function loadHistory() {
      try {
        if (fs.existsSync(historyPath)) return JSON.parse(fs.readFileSync(historyPath, 'utf8'))
      } catch {}
      return []
    }

    function saveHistory(history) {
      fs.writeFileSync(historyPath, JSON.stringify(history, null, 2))
    }

    function timeAgo(timestamp) {
      const diff = Date.now() - timestamp
      const mins = Math.floor(diff / 60000)
      const hours = Math.floor(diff / 3600000)
      const days = Math.floor(diff / 86400000)
      if (mins < 1) return 'Just now'
      if (mins < 60) return `${mins}m ago`
      if (hours < 24) return `${hours}h ago`
      return `${days}d ago`
    }

    function renderHistory(filter = '') {
      let history = loadHistory().reverse()
      if (filter) history = history.filter(h =>
        h.title.toLowerCase().includes(filter.toLowerCase()) ||
        h.url.toLowerCase().includes(filter.toLowerCase())
      )
      list.innerHTML = ''
      if (history.length === 0) {
        list.innerHTML = '<span id="empty">No history yet :3</span>'
        return
      }
      history.forEach((h, index) => {
        const div = document.createElement('div')
        div.className = 'history-item'
        div.innerHTML = `
          <img class="history-favicon" src="https://www.google.com/s2/favicons?domain=${h.url}&sz=32" onerror="this.style.display='none'"/>
          <div class="history-info">
            <div class="history-title">${h.title}</div>
            <div class="history-url">${h.url}</div>
          </div>
          <span class="history-time">${timeAgo(h.timestamp)}</span>
          <button class="history-delete">×</button>
        `
        div.querySelector('.history-info').addEventListener('click', () => {
          ipcRenderer.send('open-history-url', h.url)
        })
        div.querySelector('.history-delete').addEventListener('click', (e) => {
          e.stopPropagation()
          const history = loadHistory()
          history.splice(history.length - 1 - index, 1)
          saveHistory(history)
          renderHistory(searchBar.value)
        })
        list.appendChild(div)
      })
    }

    searchBar.addEventListener('input', () => renderHistory(searchBar.value))

    document.getElementById('clear-btn').addEventListener('click', () => {
      saveHistory([])
      renderHistory()
    })

    renderHistory()
  </script>
</body>
</html>
