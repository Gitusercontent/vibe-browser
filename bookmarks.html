<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vibe :3 - Bookmarks</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
      gap: 24px;
    }
    h1 {
      font-size: 36px;
      font-weight: 700;
      background: linear-gradient(135deg, #e94560, #0f3460);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #bookmarks-list {
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bookmark-item {
      background: #1a1a2e;
      border-radius: 12px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .bookmark-item:hover { background: #16213e; }
    .bookmark-favicon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
    }
    .bookmark-info {
      flex: 1;
      overflow: hidden;
    }
    .bookmark-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bookmark-url {
      font-size: 11px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bookmark-delete {
      background: none;
      border: none;
      color: #888;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
      border-radius: 6px;
    }
    .bookmark-delete:hover { color: #e94560; background: #0f3460; }
    #empty { color: #555; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Bookmarks :3</h1>
  <div id="bookmarks-list">
    <span id="empty">No bookmarks yet :3</span>
  </div>

  <script>
    const { ipcRenderer } = require('electron')
    const fs = require('fs')
    const path = require('path')

    const bookmarksPath = path.join(__dirname, 'bookmarks.json')
    const list = document.getElementById('bookmarks-list')
    const empty = document.getElementById('empty')

    function loadBookmarks() {
      try {
        if (fs.existsSync(bookmarksPath)) return JSON.parse(fs.readFileSync(bookmarksPath, 'utf8'))
      } catch {}
      return []
    }

    function saveBookmarks(bookmarks) {
      fs.writeFileSync(bookmarksPath, JSON.stringify(bookmarks, null, 2))
    }

    function renderBookmarks() {
      const bookmarks = loadBookmarks()
      list.innerHTML = ''
      if (bookmarks.length === 0) {
        list.innerHTML = '<span id="empty">No bookmarks yet :3</span>'
        return
      }
      bookmarks.forEach((b, index) => {
        const div = document.createElement('div')
        div.className = 'bookmark-item'
        div.innerHTML = `
          <img class="bookmark-favicon" src="https://www.google.com/s2/favicons?domain=${b.url}&sz=32" onerror="this.style.display='none'"/>
          <div class="bookmark-info">
            <div class="bookmark-title">${b.title}</div>
            <div class="bookmark-url">${b.url}</div>
          </div>
          <button class="bookmark-delete" title="Delete">×</button>
        `
        div.querySelector('.bookmark-info').addEventListener('click', () => {
          ipcRenderer.send('open-bookmark', b.url)
        })
        div.querySelector('.bookmark-delete').addEventListener('click', (e) => {
          e.stopPropagation()
          const bookmarks = loadBookmarks()
          bookmarks.splice(index, 1)
          saveBookmarks(bookmarks)
          renderBookmarks()
        })
        list.appendChild(div)
      })
    }

    ipcRenderer.on('bookmark-added', () => renderBookmarks())

    renderBookmarks()
  </script>
</body>
</html>
